<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS 预览验证</title>
    <style>
        body {
            margin: 0;
            background: #f5f5f4;
            color: #1c1917;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            max-width: 920px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 14px 35px rgba(28, 25, 23, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        p {
            color: #57534e;
            line-height: 1.7;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        input[type="file"] {
            flex: 1 1 260px;
            padding: 12px;
            border: 1px dashed #a8a29e;
            border-radius: 10px;
            background: #fafaf9;
        }

        button {
            border: 0;
            border-radius: 10px;
            background: #1c1917;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            padding: 0 20px;
        }

        dl {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 10px 16px;
            margin-top: 24px;
            word-break: break-all;
        }

        dt {
            color: #78716c;
        }

        dd {
            margin: 0;
        }

        img {
            display: block;
            max-width: 100%;
            margin-top: 24px;
            border-radius: 12px;
            border: 1px solid #e7e5e4;
        }

        @media (max-width: 640px) {
            main {
                margin: 20px auto;
            }

            button {
                width: 100%;
                min-height: 44px;
            }

            dl {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="panel">
        <h1>OSS 预览验证</h1>
        <p>上传一张图片到私有 OSS Bucket，并使用后端生成的 signed URL 进行临时预览。</p>

        <form th:action="@{/oss-preview}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">上传并预览</button>
        </form>

        <div th:if="${uploadResult != null}">
            <dl>
                <dt>capture_id</dt>
                <dd th:text="${captureId}"></dd>
                <dt>bucket</dt>
                <dd th:text="${uploadResult.bucket}"></dd>
                <dt>object_key</dt>
                <dd th:text="${uploadResult.objectKey}"></dd>
                <dt>content_type</dt>
                <dd th:text="${uploadResult.contentType}"></dd>
                <dt>size</dt>
                <dd th:text="${uploadResult.size}"></dd>
            </dl>

            <img th:src="${signedUrl}" alt="OSS signed URL preview">
        </div>
    </section>
</main>
</body>
</html>
