<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom-Graph 语料管理</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-soft: #f0f4f8;
            --ink: #1f2933;
            --muted: #64748b;
            --line: #d8dee7;
            --accent: #1f7a8c;
            --accent-dark: #155e6d;
            --success: #217a4b;
            --warn: #a46208;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(1320px, calc(100% - 32px));
            margin: 28px auto 48px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.65;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .toolbar,
        .results,
        .record {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .toolbar {
            padding: 18px;
            margin-bottom: 18px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            padding: 8px 10px;
        }

        input:focus,
        select:focus,
        button:focus {
            outline: 2px solid rgba(31, 122, 140, 0.25);
            outline-offset: 2px;
        }

        .field-options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            min-height: 40px;
            padding: 8px 0 0;
        }

        .field-options label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--ink);
            font-weight: 600;
        }

        .field-options input {
            width: 16px;
            min-height: 16px;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        button {
            min-height: 40px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 8px 14px;
        }

        .primary {
            background: var(--accent);
            color: #fff;
        }

        .primary:hover {
            background: var(--accent-dark);
        }

        .secondary {
            background: #fff;
            border-color: var(--line);
            color: var(--ink);
        }

        .secondary:disabled,
        .primary:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .results {
            padding: 18px;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .summary strong {
            font-size: 18px;
        }

        .status-line {
            color: var(--muted);
            font-size: 14px;
        }

        .record-list {
            display: grid;
            gap: 12px;
        }

        .record {
            padding: 14px;
        }

        .record-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;
            margin-bottom: 10px;
        }

        .record-title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-weight: 800;
        }

        .badge,
        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge {
            background: var(--surface-soft);
            color: var(--muted);
        }

        .badge.success {
            background: #e5f6ed;
            color: var(--success);
        }

        .badge.warn {
            background: #fff4dc;
            color: var(--warn);
        }

        .badge.danger {
            background: #fde8e5;
            color: var(--danger);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            color: var(--muted);
            font-size: 13px;
            word-break: break-all;
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            margin-top: 12px;
        }

        .text-block {
            background: #fbfcfe;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 11px;
            min-height: 92px;
        }

        .text-block h3 {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .text-block p {
            color: var(--ink);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .tag {
            background: #eaf6f8;
            color: var(--accent-dark);
        }

        .image-preview {
            display: none;
            margin-top: 12px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
        }

        .review-panel {
            display: none;
            margin-top: 12px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
        }

        .review-panel form {
            display: grid;
            gap: 10px;
        }

        .review-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }

        textarea {
            width: 100%;
            min-height: 92px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
        }

        .image-preview img {
            display: block;
            max-width: min(520px, 100%);
            max-height: 520px;
            object-fit: contain;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
        }

        .empty,
        .error {
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 22px;
            color: var(--muted);
            text-align: center;
        }

        .error {
            border-color: #f1b4ae;
            color: var(--danger);
            background: #fff7f6;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        @media (max-width: 980px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .filter-grid,
            .review-grid,
            .content-grid {
                grid-template-columns: 1fr;
            }

            .record-head,
            .actions {
                grid-template-columns: 1fr;
                align-items: stretch;
            }

            .actions {
                flex-direction: column;
            }

            .button-row,
            .button-row button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>语料管理</h1>
            <p>按平台、状态、标签、批次、采集时间和关键词检索 corpus_record。</p>
        </div>
        <nav class="nav-links">
            <a href="/corpus/analytics">分析工作台</a>
            <a href="/corpus/upload">返回上传页</a>
        </nav>
    </header>

    <section class="toolbar" aria-label="查询条件">
        <form id="queryForm">
            <div class="filter-grid">
                <label>
                    平台
                    <input name="platform" type="text" placeholder="小红书 / 微博 / 知乎">
                </label>
                <label>
                    解析状态
                    <select name="parseStatus">
                        <option value="">全部</option>
                        <option value="SUCCESS">SUCCESS</option>
                        <option value="PROCESSING">PROCESSING</option>
                        <option value="EMPTY_RESULT">EMPTY_RESULT</option>
                        <option value="MODEL_FAILED">MODEL_FAILED</option>
                        <option value="PARSE_FAILED">PARSE_FAILED</option>
                    </select>
                </label>
                <label>
                    标签
                    <input name="tag" type="text" placeholder="不带 #">
                </label>
                <label>
                    采集批次
                    <input name="captureId" type="text" placeholder="capture_id">
                </label>
                <label>
                    采集开始
                    <input name="collectedFrom" type="datetime-local">
                </label>
                <label>
                    采集结束
                    <input name="collectedTo" type="datetime-local">
                </label>
                <label>
                    关键词
                    <input name="keyword" type="search" placeholder="单关键词">
                </label>
                <label>
                    每页数量
                    <input name="pageSize" type="number" min="1" max="100" value="20">
                </label>
            </div>

            <div class="actions">
                <div>
                    <div class="status-line">检索字段</div>
                    <div class="field-options">
                        <label><input type="checkbox" name="searchFields" value="rawContent" checked> 评论原文</label>
                        <label><input type="checkbox" name="searchFields" value="contextTarget" checked> 上下文原文</label>
                    </div>
                </div>
                <div class="button-row">
                    <button class="secondary" type="button" id="resetButton">重置</button>
                    <button class="primary" type="submit" id="searchButton">查询</button>
                </div>
            </div>
        </form>
    </section>

    <section class="results" aria-label="查询结果">
        <div class="summary">
            <strong id="resultTitle">查询结果</strong>
            <span class="status-line" id="resultSummary">尚未查询</span>
        </div>
        <div id="message" class="empty">设置筛选条件后点击查询。</div>
        <div id="recordList" class="record-list"></div>
        <div class="pagination">
            <button class="secondary" type="button" id="prevPage" disabled>上一页</button>
            <span class="status-line" id="pageInfo">第 1 页</span>
            <button class="secondary" type="button" id="nextPage" disabled>下一页</button>
        </div>
    </section>
</main>

<script>
    (() => {
        const form = document.querySelector("#queryForm");
        const resetButton = document.querySelector("#resetButton");
        const searchButton = document.querySelector("#searchButton");
        const prevPageButton = document.querySelector("#prevPage");
        const nextPageButton = document.querySelector("#nextPage");
        const resultSummary = document.querySelector("#resultSummary");
        const pageInfo = document.querySelector("#pageInfo");
        const message = document.querySelector("#message");
        const recordList = document.querySelector("#recordList");

        let currentPage = 1;
        let totalPages = 0;

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            currentPage = 1;
            search();
        });

        resetButton.addEventListener("click", () => {
            form.reset();
            form.querySelector("input[name='pageSize']").value = "20";
            form.querySelectorAll("input[name='searchFields']").forEach((input) => input.checked = true);
            currentPage = 1;
            totalPages = 0;
            renderEmpty("设置筛选条件后点击查询。");
        });

        prevPageButton.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage -= 1;
                search();
            }
        });

        nextPageButton.addEventListener("click", () => {
            if (currentPage < totalPages) {
                currentPage += 1;
                search();
            }
        });

        async function search() {
            searchButton.disabled = true;
            message.className = "empty";
            message.textContent = "正在查询...";
            message.style.display = "block";
            recordList.replaceChildren();

            try {
                const response = await fetch(`/api/v1/corpus?${buildQueryString()}`, {
                    headers: {"Accept": "application/json"}
                });
                if (!response.ok) {
                    throw new Error(await readError(response));
                }
                renderPage(await response.json());
            } catch (error) {
                renderError(error.message || "查询失败");
            } finally {
                searchButton.disabled = false;
            }
        }

        function buildQueryString() {
            const formData = new FormData(form);
            const params = new URLSearchParams();
            const searchFields = formData.getAll("searchFields");
            for (const [key, value] of formData.entries()) {
                if (key === "searchFields") {
                    continue;
                }
                if (value !== null && String(value).trim() !== "") {
                    params.append(key, normalizeDateTimeValue(key, String(value).trim()));
                }
            }
            searchFields.forEach((field) => params.append("searchFields", field));
            params.set("page", String(currentPage));
            return params.toString();
        }

        function normalizeDateTimeValue(key, value) {
            if ((key === "collectedFrom" || key === "collectedTo") && value.length === 16) {
                return `${value}:00`;
            }
            return value;
        }

        async function readError(response) {
            const text = await response.text();
            if (!text) {
                return `HTTP ${response.status}`;
            }
            try {
                const body = JSON.parse(text);
                return body.message || body.error || text;
            } catch {
                return text;
            }
        }

        function renderPage(page) {
            currentPage = Number(page.page || 1);
            totalPages = Number(page.totalPages || 0);
            const records = Array.isArray(page.records) ? page.records : [];

            resultSummary.textContent = `共 ${page.total || 0} 条，当前第 ${currentPage} / ${totalPages || 1} 页`;
            pageInfo.textContent = `第 ${currentPage} 页`;
            prevPageButton.disabled = currentPage <= 1;
            nextPageButton.disabled = totalPages === 0 || currentPage >= totalPages;

            if (records.length === 0) {
                recordList.replaceChildren();
                message.className = "empty";
                message.textContent = "没有匹配的语料。";
                message.style.display = "block";
                return;
            }

            message.style.display = "none";
            recordList.replaceChildren(...records.map(renderRecord));
        }

        function renderRecord(record) {
            const article = document.createElement("article");
            article.className = "record";
            article.innerHTML = `
                <div class="record-head">
                    <div>
                        <div class="record-title">
                            <span>#${escapeHtml(record.id)}</span>
                            <span>${escapeHtml(record.platform || "未知平台")}</span>
                            <span class="${statusClass(record.parseStatus)}">${escapeHtml(record.parseStatus || "-")}</span>
                            <span class="${reviewStatusClass(record.reviewStatus)}">${escapeHtml(record.reviewStatus || "UNREVIEWED")}</span>
                        </div>
                        <div class="meta">
                            <span>capture_id: ${escapeHtml(record.captureId || "-")}</span>
                            <span>comment_index: ${escapeHtml(record.commentIndex ?? "-")}</span>
                            <span>collected_time: ${escapeHtml(formatTime(record.collectedTime))}</span>
                            <span>image_hash: ${escapeHtml(record.imageHash || "-")}</span>
                        </div>
                    </div>
                    <div class="button-row">
                        <button class="secondary" type="button" data-review-toggle>校对</button>
                        <button class="secondary" type="button" data-image-id="${escapeHtml(record.id)}">图片预览</button>
                    </div>
                </div>
                <div class="content-grid">
                    <section class="text-block">
                        <h3>评论原文</h3>
                        <p>${escapeHtml(record.rawContent || "")}</p>
                    </section>
                    <section class="text-block">
                        <h3>上下文原文</h3>
                        <p>${escapeHtml(record.contextTarget || "")}</p>
                    </section>
                </div>
                <div class="tags">${renderTags(record.tags)}</div>
                <div class="review-panel" data-review-panel>${renderReviewForm(record)}</div>
                <div class="image-preview" data-image-preview></div>
            `;
            article.querySelector("[data-review-toggle]").addEventListener("click", () => {
                const panel = article.querySelector("[data-review-panel]");
                panel.style.display = panel.style.display === "block" ? "none" : "block";
            });
            article.querySelector("[data-review-form]").addEventListener("submit", (event) => {
                event.preventDefault();
                submitReview(event.currentTarget, record.id);
            });
            article.querySelector("[data-image-id]").addEventListener("click", (event) => {
                loadImagePreview(event.currentTarget, article.querySelector("[data-image-preview]"));
            });
            return article;
        }

        function renderTags(tags) {
            if (!Array.isArray(tags) || tags.length === 0) {
                return '<span class="badge">无标签</span>';
            }
            return tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
        }

        function renderReviewForm(record) {
            const reviewedTags = Array.isArray(record.reviewedTags) && record.reviewedTags.length > 0
                ? record.reviewedTags
                : (Array.isArray(record.tags) ? record.tags : []);
            return `
                <form data-review-form>
                    <div class="review-grid">
                        <label>
                            校对状态
                            <select name="reviewStatus">
                                <option value="UNREVIEWED" ${selected(record.reviewStatus, "UNREVIEWED")}>UNREVIEWED</option>
                                <option value="REVIEWED" ${selected(record.reviewStatus, "REVIEWED")}>REVIEWED</option>
                                <option value="CORRECTED" ${selected(record.reviewStatus, "CORRECTED")}>CORRECTED</option>
                            </select>
                        </label>
                        <label>
                            人工标签
                            <input name="reviewedTags" type="text" value="${escapeAttribute(reviewedTags.join(", "))}" placeholder="多个标签用逗号分隔">
                        </label>
                    </div>
                    <div class="review-grid">
                        <label>
                            人工修正评论原文
                            <textarea name="reviewedRawContent">${escapeHtml(record.reviewedRawContent || record.rawContent || "")}</textarea>
                        </label>
                        <label>
                            人工修正上下文原文
                            <textarea name="reviewedContextTarget">${escapeHtml(record.reviewedContextTarget || record.contextTarget || "")}</textarea>
                        </label>
                    </div>
                    <label>
                        校对备注
                        <textarea name="reviewNote">${escapeHtml(record.reviewNote || "")}</textarea>
                    </label>
                    <div class="button-row">
                        <button class="primary" type="submit">保存校对</button>
                    </div>
                    <div class="status-line" data-review-message></div>
                </form>
            `;
        }

        async function submitReview(form, id) {
            const message = form.querySelector("[data-review-message]");
            const submitButton = form.querySelector("button[type='submit']");
            const formData = new FormData(form);
            const reviewStatus = formData.get("reviewStatus");
            const body = {
                reviewStatus,
                reviewNote: String(formData.get("reviewNote") || "").trim()
            };
            if (reviewStatus === "CORRECTED") {
                body.reviewedRawContent = String(formData.get("reviewedRawContent") || "").trim();
                body.reviewedContextTarget = String(formData.get("reviewedContextTarget") || "").trim();
                body.reviewedTags = String(formData.get("reviewedTags") || "")
                    .split(",")
                    .map((tag) => tag.trim())
                    .filter((tag) => tag.length > 0);
            }

            submitButton.disabled = true;
            message.textContent = "正在保存...";
            try {
                const response = await fetch(`/api/v1/corpus/${encodeURIComponent(id)}/review`, {
                    method: "PATCH",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) {
                    throw new Error(await readError(response));
                }
                message.textContent = "已保存，正在刷新结果。";
                await search();
            } catch (error) {
                message.textContent = error.message || "保存失败";
            } finally {
                submitButton.disabled = false;
            }
        }

        async function loadImagePreview(button, preview) {
            const id = button.dataset.imageId;
            button.disabled = true;
            button.textContent = "加载中";
            try {
                const response = await fetch(`/api/v1/corpus/${encodeURIComponent(id)}/image-url`, {
                    headers: {"Accept": "application/json"}
                });
                if (!response.ok) {
                    throw new Error(await readError(response));
                }
                const body = await response.json();
                preview.innerHTML = `<img src="${escapeAttribute(body.signedUrl || "")}" alt="截图预览">`;
                preview.style.display = "block";
                button.textContent = "刷新预览";
            } catch (error) {
                preview.innerHTML = `<div class="error">${escapeHtml(error.message || "图片链接获取失败")}</div>`;
                preview.style.display = "block";
                button.textContent = "重试预览";
            } finally {
                button.disabled = false;
            }
        }

        function renderEmpty(text) {
            recordList.replaceChildren();
            message.className = "empty";
            message.textContent = text;
            message.style.display = "block";
            resultSummary.textContent = "尚未查询";
            pageInfo.textContent = `第 ${currentPage} 页`;
            prevPageButton.disabled = true;
            nextPageButton.disabled = true;
        }

        function renderError(text) {
            recordList.replaceChildren();
            message.className = "error";
            message.textContent = text;
            message.style.display = "block";
            resultSummary.textContent = "查询失败";
            prevPageButton.disabled = true;
            nextPageButton.disabled = true;
        }

        function statusClass(status) {
            if (status === "SUCCESS") {
                return "badge success";
            }
            if (status === "PROCESSING" || status === "EMPTY_RESULT") {
                return "badge warn";
            }
            if (status === "MODEL_FAILED" || status === "PARSE_FAILED") {
                return "badge danger";
            }
            return "badge";
        }

        function reviewStatusClass(status) {
            if (status === "CORRECTED") {
                return "badge success";
            }
            if (status === "REVIEWED") {
                return "badge warn";
            }
            return "badge";
        }

        function selected(actual, expected) {
            const normalized = actual || "UNREVIEWED";
            return normalized === expected ? "selected" : "";
        }

        function formatTime(value) {
            return value ? String(value).replace("T", " ") : "-";
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replaceAll("`", "&#96;");
        }
    })();
</script>
</body>
</html>
