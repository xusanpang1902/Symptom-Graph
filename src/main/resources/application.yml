server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: symptom-graph
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:symptom_graph}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

knife4j:
  enable: ${KNIFE4J_ENABLE:true}

app:
  vision:
    provider: ${VISION_PROVIDER:gemini}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    bucket: ${ALIYUN_OSS_BUCKET}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    object-prefix: ${ALIYUN_OSS_OBJECT_PREFIX:corpus/}
    signed-url-expiration-minutes: ${ALIYUN_OSS_SIGNED_URL_EXPIRATION_MINUTES:30}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:}
    endpoint: ${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1}
    referer: ${OPENROUTER_REFERER:}
    title: ${OPENROUTER_TITLE:Symptom-Graph}
  markdown:
    output-dir: ${OBSIDIAN_OUTPUT_DIR:obsidian-output}
  bloom:
    enabled: ${BLOOM_FILTER_ENABLED:false}
    name: ${BLOOM_FILTER_NAME:symptom_graph_hash_bloom}
    expected-insertions: ${BLOOM_FILTER_EXPECTED_INSERTIONS:100000}
    false-probability: ${BLOOM_FILTER_FALSE_PROBABILITY:0.01}
  rabbitmq:
    corpus-exchange: ${CORPUS_PROCESS_EXCHANGE:corpus.process.exchange}
    corpus-process-queue: ${CORPUS_PROCESS_QUEUE:corpus.process.queue}
    corpus-routing-key: ${CORPUS_PROCESS_ROUTING_KEY:corpus.process}
    listener-auto-startup: ${CORPUS_PROCESS_LISTENER_AUTO_STARTUP:true}
